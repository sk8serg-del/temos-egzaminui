# Озвучка новых фраз (lt_audio.py, голос Ona) + публикация сайта на GitHub Pages.
# Запускается при каждом push в main (в т.ч. когда кнопка «🔊 Озвучить правки» обновляет edits.json).
name: voice-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: voice-and-deploy
  cancel-in-progress: false

jobs:
  voice:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Озвучить новые фразы
        run: |
          pip install edge-tts
          python lt_audio.py

      - name: Сохранить mp3 в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if ! git diff --cached --quiet; then
            git commit -m "Озвучка новых фраз"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
